name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The suite makes no API calls and does not touch the media stack, so it
      # uses the SDK with mocked calls, not Pillow or PyAV.
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
